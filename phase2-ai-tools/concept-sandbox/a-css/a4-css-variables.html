<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>개념 A4 · CSS 변수</title>

  <!-- 실습장이므로 style 블록을 쓴다. style="..." 속성은 여기서도 금지. -->
  <style>
    /* ===============================================================
       변수 선언 자리
       :root 는 문서의 가장 바깥 요소(<html>)를 가리키는 선택자다.
       여기 선언한 변수는 모든 자손이 물려받는다.
       =============================================================== */
    :root {
      --color-bg: #fafafa;
      --color-text: #222;
      --color-accent: #1b6ef3;
      --space: 16px;
    }

    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      line-height: 1.7;
      background-color: var(--color-bg);
      color: var(--color-text);
    }

    hr {
      margin: 3rem 0;
    }

    /* 실험 전체에서 쓰는 공통 상자.
       색을 직접 적지 않고 전부 변수로 받는다. */
    .swatch {
      border: 4px solid var(--color-accent);
      padding: var(--space);
      margin-bottom: 1rem;
      width: 320px;
    }

    .swatch strong {
      color: var(--color-accent);
    }

    /* ===============================================================
       실험 1 · 변수의 범위 (scope)
       .zone 안에서만 --color-accent 를 다시 선언한다.
       =============================================================== */
    .zone {
      --color-accent: #2f9e44;
      background-color: #eef7ee;
      padding: 1rem;
    }

    /* ===============================================================
       실험 2 · 테마 전환
       .swatch 규칙은 한 글자도 건드리지 않는다.
       변수 값만 바꿔 끼운다.
       =============================================================== */
    [data-theme="dark"] {
      --color-bg: #16181d;
      --color-text: #e6e6e6;
      --color-accent: #ffb020;
    }

    /* ===============================================================
       실험 3 · 틀린 이름을 쓰면 어떻게 되는가
       두 상자 모두 "앞 줄에 orange 가 있고 뒤 줄이 잘못됨" 구조다.
       차이는 뒤 줄이 틀린 방식뿐이다.
       =============================================================== */
    .typo-value {
      background-color: orange;
      background-color: blu;              /* 값 오타. 변수 아님 */
    }

    .typo-variable {
      background-color: orange;
      background-color: var(--color-acent); /* 변수 이름 오타. c 하나 빠짐 */
    }

    .with-fallback {
      background-color: var(--color-acent, orange); /* 두 번째 자리 = 대체값 */
    }
  </style>
</head>

<body>

  <h1>A4 실습 · CSS 변수 (Custom Properties)</h1>
  <p>
    F12 → Elements 탭에서 상자를 클릭하고 <strong>Styles</strong> 패널을 보십시오.
    취소선이 그어진 선언, 경고 아이콘이 붙은 선언이 단서입니다.
  </p>

  <hr>

  <!-- =================================================================
       실험 1 · 범위
       같은 .swatch 두 개. 하나는 .zone 밖, 하나는 안.
       ================================================================= -->
  <section>
    <h2>실험 1 · 안쪽에서 다시 선언하면 어디까지 바뀌는가</h2>

    <div class="swatch" id="outside"><strong>A</strong> · .zone 바깥</div>

    <div class="zone">
      <div class="swatch" id="inside"><strong>B</strong> · .zone 안쪽</div>
    </div>

    <div class="swatch" id="after"><strong>C</strong> · .zone 다음</div>
  </section>

  <hr>

  <!-- =================================================================
       실험 2 · 테마 전환
       버튼은 <html> 에 data-theme 속성을 붙였다 뗐다만 한다.
       ================================================================= -->
  <section>
    <h2>실험 2 · 속성 하나로 페이지 전체 색이 바뀌는가</h2>

    <button type="button" id="theme-toggle">data-theme 토글</button>
    <p id="theme-state"></p>
  </section>

  <hr>

  <!-- =================================================================
       실험 3 · 오타
       ================================================================= -->
  <section>
    <h2>실험 3 · 틀리게 쓰면 무엇이 남는가</h2>

    <div class="swatch typo-value" id="typo-value">D · 값 오타 (<code>blu</code>)</div>
    <div class="swatch typo-variable" id="typo-variable">E · 변수 이름 오타 (<code>--color-acent</code>)</div>
    <div class="swatch with-fallback" id="with-fallback">F · 대체값 사용</div>
  </section>

  <script>
    // getComputedStyle 은 "브라우저가 최종 계산한 스타일"을 돌려준다.
    // CSS 파일에 적힌 글자가 아니라, 상속과 덮어쓰기가 모두 끝난 결과다.
    const readAccent = (id) =>
      getComputedStyle(document.getElementById(id)).getPropertyValue('--color-accent').trim();

    const readBg = (id) =>
      getComputedStyle(document.getElementById(id)).backgroundColor;

    // 실험 1 확인용
    console.log('[실험1] A 바깥 --color-accent :', readAccent('outside'));
    console.log('[실험1] B 안쪽 --color-accent :', readAccent('inside'));
    console.log('[실험1] C 다음 --color-accent :', readAccent('after'));

    // 실험 3 확인용. rgba(0, 0, 0, 0) 은 "완전 투명"이라는 뜻이다.
    console.log('[실험3] D 배경 :', readBg('typo-value'));
    console.log('[실험3] E 배경 :', readBg('typo-variable'));
    console.log('[실험3] F 배경 :', readBg('with-fallback'));

    // 실험 2. 속성만 바꾸고 스타일은 한 줄도 직접 건드리지 않는다.
    const root = document.documentElement;
    const toggleButton = document.getElementById('theme-toggle');
    const stateText = document.getElementById('theme-state');

    const showState = () => {
      stateText.textContent = `현재 data-theme = ${root.dataset.theme ?? '(없음)'}`;
    };

    toggleButton.addEventListener('click', () => {
      if (root.dataset.theme === 'dark') {
        delete root.dataset.theme;
      } else {
        root.dataset.theme = 'dark';
      }
      showState();
      console.log('[실험2] 토글 후 A 의 --color-accent :', readAccent('outside'));
    });

    showState();
  </script>

</body>

</html>
